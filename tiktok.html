<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login TikTok | Quiz Palito</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito+Sans:wght@400;700&display=swap">
<style>
/* Layout: one readable column, a mascot-orange title band, two policy sections with anchors */
:root {
  --bg: #f6f7fb; --fg: #17213f; --muted: #55607e; --accent: #f08a00; --line: #dde1ec; --card: #ffffff;
  --display: "Baloo 2", "Trebuchet MS", sans-serif; --body: "Nunito Sans", "Segoe UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11162a; --fg: #e8ebf5; --muted: #a3abc6; --accent: #ffa733; --line: #2a3150; --card: #181e36; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11162a; --fg: #e8ebf5; --muted: #a3abc6; --accent: #ffa733; --line: #2a3150; --card: #181e36; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font: 16px/1.65 var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 40px 64px; }
main { max-width: 680px; margin: 0 auto; display: grid; gap: 32px; }
header { display: grid; gap: 8px; }
.selo { justify-self: start; font: 800 15px/1 var(--display); letter-spacing: .04em; padding: 8px 14px; border-radius: 999px;
  background: var(--card); border: 2px solid var(--fg); }
.selo b { color: var(--accent); }
h1 { font: 800 clamp(30px, 6vw, 42px)/1.1 var(--display); margin: 8px 0 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 0; }
nav { display: flex; flex-wrap: wrap; gap: 8px 20px; font-weight: 700; }
nav a, a { color: var(--accent); }
section { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 24px; display: grid; gap: 12px; }
h2 { font: 800 24px/1.2 var(--display); margin: 0; }
h3 { font: 700 13px/1.3 var(--body); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 12px 0 0; }
p, ul { margin: 0; } ul { padding-left: 20px; display: grid; gap: 6px; }
.en { border-top: 1px solid var(--line); padding-top: 12px; color: var(--muted); font-size: 15px; }
footer { color: var(--muted); font-size: 14px; }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: 800 18px/1 var(--display); padding: 14px 20px; border-radius: 12px; border: 0; background: var(--accent); color: #17213f; cursor: pointer; }
#end { width: 100%; box-sizing: border-box; min-height: 120px; font: 13px/1.4 ui-monospace, monospace; padding: 10px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--bg); color: var(--fg); word-break: break-all; }
#ok { color: var(--accent); font-weight: 700; min-height: 1.6em; }
</style>
</head>
<body>
<main>
<header>
  <span class="selo">QUIZ <b>PALITO</b></span>
  <h1>Login do TikTok feito</h1>
  <p class="sub">Falta só um passo: copiar este endereço e colar no GitHub.</p>
</header>
<section>
  <p id="msg">1. Toque em <b>Copiar</b>.</p>
  <textarea id="end" readonly></textarea>
  <button id="copiar" type="button">Copiar</button>
  <p id="ok" aria-live="polite"></p>
  <p>2. No GitHub, abra <b>Actions &gt; Autorizar TikTok &gt; Run workflow</b>, cole no campo <b>endereco</b> e rode.</p>
</section>
<footer>Página usada só pelo dono do canal Quiz Palito.</footer>
</main>
<script>
var e = document.getElementById('end'), q = new URLSearchParams(location.search);
e.value = location.href;
if (q.get('error')) document.getElementById('msg').textContent = 'O TikTok recusou o login: ' + (q.get('error_description') || q.get('error'));
else if (!q.get('code')) document.getElementById('msg').textContent = 'Esta página não tem o código do login. Abra o link de login de novo.';
document.getElementById('copiar').onclick = function () {
  e.select();
  var ok = function () { document.getElementById('ok').textContent = 'Copiado!'; };
  if (navigator.clipboard) navigator.clipboard.writeText(e.value).then(ok, function () { document.execCommand('copy'); ok(); });
  else { document.execCommand('copy'); ok(); }
};
</script>
</body>
</html>
